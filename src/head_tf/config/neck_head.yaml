# 新平台三軸脖子的頭部模型設定（head_tf/neck_model.py 用）。舊機器人兩軸頭的設定是 head_axes.yaml、head_model.yaml，和這個無關。
#
# 相機在頭上的位置不在這裡：用 bottle_localization/config/camera_extrinsics.yaml（在基準刻度校正好的外參）反推，
# 所以重新校正外參時，要同時更新下面的 reference_ticks（校正當時三顆馬達的刻度）。

# ---- URDF 連桿：base_link -> head_Link ----
# 抄自 seven_axis_arm_head_urdf/urdf/seven_axis_arm_head_urdf.urdf（SolidWorks 7-arm 匯出，2026-11-13）。
# test_neck_model.py 會拿 URDF 原檔比對（桌機有 ~/nstc_ws/seven_axis_arm_head_urdf 才比）。
# 正方向（URDF 定義）：neckYaw 往左轉、neckPitch 低頭、headRoll 頭往右歪。
chain:
  - {name: neck_base_joint, type: fixed,    xyz: [0.00875, 0.0, -0.022], rpy: [0.0, 0.0, 0.0]}
  - {name: neckYawJoint,    type: revolute, xyz: [0.0, 0.0, 0.039],      rpy: [0.0, 0.0, 0.0], axis: [0.0, 0.0, 1.0], limit: [-0.965, 0.965]}
  - {name: neckPitchJoint,  type: revolute, xyz: [0.0, 0.0, 0.035],      rpy: [0.0, 0.0, 0.0], axis: [0.0, 1.0, 0.0], limit: [-0.588, 1.873]}
  - {name: headRollJoint,   type: revolute, xyz: [0.0, 0.0, 0.038],      rpy: [0.0, 0.0, 0.0], axis: [1.0, 0.0, 0.0], limit: [-0.699, 0.699]}

# ---- 量測修正：實際的轉頭軸相對桌面（base_link）歪了多少，度 ----
# 套在 neck_base 之後（URDF 的數字不動）。roll 負 = 轉頭軸上端往左傾；pitch 正 = 往前傾。
# 2026-11-19 neck_01 擬合（IMU + 藥罐）：轉頭時 IMU pitch 跟著變 ±0.4°、藥罐往同一方向偏。
# 加上這個修正，藥罐和基準姿勢差的 95% 從 6.9 降到 5.1 mm、最大從 10.3 降到 8.2 mm。
# 也吻合：30 號要轉到 2025（往右歪約 2°）相機才水平；扣掉這 1.3°，相機裝在頭上只歪約 0.5°。
neck_tilt_deg: {roll: -1.30, pitch: 0.63}

# URDF 的 zed_camera_center（前玻璃中心）在 head_Link 的位置，只拿來檢查反推出的相機位置合不合理
camera_center_in_head: [0.0531714209, 0.0000847796, 0.0761467857]

# ---- 馬達對應 ----
# head_id = nstc_msgs/HeadPackage 的 id（driver_node 的 head_map：1 -> 28、2 -> 29、3 -> 30）。
# 關節角 = sign × (刻度 − zero_tick) × 360° / 4096。sign 是 2026-11-18 實測：
#   28 號刻度變大往左轉（= URDF 正方向，+1）
#   29 號刻度變小往下看（URDF 正方向是低頭，-1）
#   30 號刻度變大往左歪（URDF 正方向是往右歪，-1）
# zero_tick：網頁「回正」按鈕把三顆都轉到 2048。29 號在 1708 時相機 pitch 實測 30.4°（換算 29.9°），對得起來。
motors:
  neckYawJoint:   {motor_id: 28, head_id: 1, sign: 1,  zero_tick: 2048}
  neckPitchJoint: {motor_id: 29, head_id: 2, sign: -1, zero_tick: 2048}
  headRollJoint:  {motor_id: 30, head_id: 3, sign: -1, zero_tick: 2048}

# ---- 基準刻度：camera_extrinsics.yaml 校正當時的刻度（2026-11-18 /joint_states）----
reference_ticks:
  28: 2047
  29: 1708
  30: 2024

# ---- 允許範圍（刻度，含兩端）：超出就不發可用的外參 ----
# 判斷時兩端各放寬 range_margin_ticks：29 號在最低點會因為重力下垂 3～4 格（neck_01：目標 1594 停在 1590；1500 還沒量過）。
# head_sweep 收資料的姿勢不受影響（還是在下面的範圍內）。
range_margin_ticks: 6
# 2026-11-18 和使用者定：歪頭固定、轉頭左右 15°、低頭 20°～40°。抓取時頭不動，這是為了之後的場景先做。
# 2026-11-20 使用者：低頭要到 1500（48°）才看得到桌子前段，機構實測可以；抬頭不重要，上限照舊。
#   1500 時畫面下緣看到桌緣往前約 2 cm（模型算的）。1594 以下的準度要等 neck_03 驗證。
allowed_ticks:
  28: [1877, 2218]   # 2048 ± 15° / 0.0879°
  29: [1500, 1820]   # 低頭 48° ～ 20°
  30: [2014, 2034]   # 固定在 2024，留 ±10 格（±0.9°）給馬達抖動
