# 頭部兩個轉軸的手量位置，階段 3 擬合頭部模型時當起始值。
#
# 量測方式（2026-11-10）：
#   - 頭在基準刻度 pan（28 號）2048、tilt（29 號）2300，機器人站好。
#   - 從馬達轉軸中心量到 ZED 底部螺絲孔（zed_camera_link 的原點）。
#   - 尺擺平行地板 / 垂直地板（不是沿著頭的斜面），單位 cm。
#
# 存的是「轉軸 -> 螺絲孔」的相對量，不是 base_link 座標：轉軸和螺絲孔都在頭上，相對位置不會變；
# 螺絲孔在 base_link 的位置由 camera_extrinsics.yaml 提供，那邊重新校正時轉軸會跟著一起移。
# 之後 ZED 搬到新手臂平台、頭的結構一樣的話，這個檔可以沿用，只要重量確認。
#
# 用目前的 camera_extrinsics.yaml（螺絲孔在 base_link (8.70, 9.16, 15.07) cm）換算：
#   pan 軸  = 垂直線，通過 x = 2.20 cm、y = 9.16 cm
#   tilt 軸 = 左右方向的水平線，通過 x = 7.70 cm、z = 10.07 cm

reference_ticks:
  pan: 2048
  tilt: 2300

# 從轉軸中心到螺絲孔：往前 / 往左 / 往上，cm
pan_axis_to_screw_cm:
  forward: 6.5
  left: 0.0
  # pan 軸是垂直的，上下位置不影響結果，所以沒量
# 注意：sweep_01 的資料擬合出 tilt 軸在螺絲孔後方 8.1 cm、下方 3.2 cm，和這裡差很多（README「階段 3」）。
# 2026-11-10 確認以擬合值為準（手量轉軸中心不容易準），這裡只當擬合的起始值。
tilt_axis_to_screw_cm:
  forward: 1.0
  up: 5.0
  # tilt 軸是左右方向的，左右位置不影響結果，所以沒量

# 軸的方向（基準刻度時，用 base_link 的軸表示）。先假設 pan 垂直、tilt 左右水平，階段 3 用資料修正。
pan_axis_direction: [0.0, 0.0, 1.0]
tilt_axis_direction: [0.0, 1.0, 0.0]

# 刻度變大時往哪轉（sweep_01 確認，2026-11-10）：
#   pan_sign:  +1 = 刻度變大往左轉，-1 = 往右轉
#   tilt_sign: +1 = 刻度變大往下看，-1 = 往上看
pan_sign: 1
tilt_sign: 1
