    max_position: 3.14
    has_velocity_limits: true
    max_velocity: 2.3824000000000001
    has_acceleration_limits: true
    max_acceleration: 1.0
  LforarmJoint:
    has_velocity_limits: true
    max_velocity: 2.3824000000000001
    has_acceleration_limits: true
    max_acceleration: 1.0
  LshoulderJoint:
    has_velocity_limits: true
    max_velocity: 2.3824000000000001
    has_acceleration_limits: true
    max_acceleration: 1.0
  Lwrist1Joint:
    has_velocity_limits: true
    max_velocity: 2.3824000000000001
    has_acceleration_limits: true
    max_acceleration: 1.0
  LwristJoint:
    has_velocity_limits: true
