# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

right_arm_controller:
  ros__parameters:
    joints:
      - RshoulderJoint
      - RarmJoint
      - Rarm1Joint
      - RforarmJoint
      - Rforarm1Joint
      - RwristJoint
      - Rwrist1Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
left_arm_controller:
  ros__parameters:
    joints:
      - LshoulderJoint
      - LarmJoint
      - Larm1Joint
      - LforarmJoint
      - Lforarm1Joint
      - LwristJoint
      - Lwrist1Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true