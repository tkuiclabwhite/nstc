# 子三任務管理設定。改完重開節點才生效。

# YOLO 的類別名稱（bottle_localization/config/bottle_dims.yaml 的 key）
bottle_classes: [b1, b2, b3, b4]

# 放置點：實機量測座標 [前, 右, 放置面的高]（cm）。【待量測】
# 「高」是藥瓶要放上去的那個面（tray 底面）離地多高，不是掌心：掌心高度依手上藥瓶的高度算（grasp_plan.place_poses，
# 從上方 = 放置面 + 瓶高 + palm_gap_cm + place_gap_cm）。2026-11-19 前寫死掌心離桌 12，高的瓶子（b1、b3）一定撞桌子。
# 任務管理只選「藥瓶和放置點都搆得到」的那隻手（workspace 表），所以右邊的藥瓶不能放到 tray_2。
place_targets:
  # 2026-11-19 前 19 → 28：實機跟隨開著時 moveit_bridge 檢查實機的位置（手比模擬低 5.5），tray 離假藥瓶 b1（右 18.9 前 12）
  # 只有 9.3 cm，手掌會壓到 b1、擦到 b3，放下一直 collision。前 28 離 b1 17、b3 19 cm，右 25 最遠到 34
  tray_1: {pos_cm: [41.35, 25.0, 81.2], approach: top}   # 右手：桌面座標 右 25、前 28，先當 tray 放在桌上、沒有厚度（暫定）
  tray_2: {pos_cm: [41.35, -25.0, 81.2], approach: top}  # 左手：tray_1 的鏡像（暫定）

# 預備姿勢（ready pose）：任務開始前、夾完（放完）之後都回這裡，網頁 Ready pose 按鈕也是。
# 桌面座標 [右, 前, 上]（cm）= 掌心位置，掌心朝下（top）。2026-11-19 使用者先在網頁測試區抓 (±25, 15, 10)，
# 實機測過太低（手最低在掌心下 4.5、往身體那側垂下來，會壓到下面的藥瓶），改成 (±35, 15, 15)；
# 錄路線實機測過後再改成左右 50、高再 +5（使用者 2026-11-19）。
# 掌心離桌 20 → 手最低離桌約 15.5 cm（最高的 b1 9.2）。量測座標 = 前 28.4、右 ±50、高 101.2。
# 可及範圍表在左右 50 最遠只到前 18（掌心離桌 10 量的），前 15 在範圍內但靠近邊；到不了的話錄的時候會失敗
# via：path = 照錄好的路線走（2026-11-19 使用者要的）：兩隻手同時走、每次路線一樣，回站姿倒過來走（見 ready_path.py）。
#             還沒錄、位置改了、路線會撞到時，改用 move。錄：手在站姿時按網頁「錄 ready 路線」
#      move = 用 /arm_move 依序把兩隻手的掌心移到這兩點（MoveIt 一般規劃，左手再右手，路線每次不一樣）
#      arm_ready = 交給手臂端的 /arm_ready（手臂負責人還沒做；做好後它的 ready 要對到這兩點）
ready_pose:
  via: path
  approach: top
  left: [-50.0, 15.0, 20.0]
  right: [50.0, 15.0, 20.0]
  speed: 50            # 照錄好的路線走（站姿 ↔ ready）的速度，Dynamixel 單位（實機上限 50）。2026-11-19 使用者：30 → 50。
                       # 走的時候實機馬達速度（/arm_speed_cmd）也切到這個，走完切回 grasp.arm_speed：馬達比軌跡慢的話實機會跟不上、抄近路
  accel: 1.5           # 照錄好的路線走的加速度上限（rad/s²）。沒寫 = 跟著速度縮（MoveIt 慣例：1.0 × 速度/99，速度 50 只有 0.5）。
                       # 2026-11-26 使用者：速度上限 50 沒用到（最快一軸只到 37%），卡的是加速度 → 1.5：離線 8.05 → 6.2 秒、
                       # 最快一軸 0.44 → 0.63 rad/s（還在 50 = 1.2 rad/s 內，實機跟得上）。2.0 → 5.4 秒
  path_file: ~/nstc/src/sp3_task_manager/config/ready_path.yaml   # 錄好的路線存在這裡（重錄會蓋掉）
  # 兩隻手都用這隻手錄到的路線（null = 各用各的）。URDF 左右鏡像：同一組關節角 = 左右相反的姿勢，left、right 要左右對稱。
  # 2026-11-19 實機：左手自己錄到的路線舉到掌心高 83 就往前，越過桌緣時手最低只比桌面高約 4 cm，實機拇指擦到桌角；
  # 右手的路線先舉到掌心高 113 才往前（越過桌緣時離桌面 30 cm 以上）→ 兩隻手都用右手的。錄的時候也只舉這隻手
  mirror: right
  # 只改某隻手的路線（不用重錄）：掌心平移、姿態不變，逐點逆解（ready_path.adjust）。量測座標的位移 [前, 右, 上] cm。
  #   edge：只在經過桌角那段（路程 24%→31% 加上、維持到 45%、58% 前拿掉），起點、終點不變
  #   end ：從 45% 起加上、一直到 ready（ready 也跟著移）
  # 2026-11-19 實機：左手比右手低約 1 cm（馬達讀數一樣 = 機構），共用右手路線時左手拇指經過桌角擦到（路線在 34% 拇指只比
  # 桌面高 1.8、在桌緣後 2.9 cm）。那段往上抬很貴（1 cm 要轉 10～13°），往後便宜 → 經過桌角時往後 2、往上 1
  # （URDF 算：離真的桌子 3.2 → 5.5 cm；往後 3 逆解不到），ready 往上 1 跟右手一樣高
  # 2026-11-26：右手經過桌角也只離真的桌子 2.8～3.2 cm（照馬達讀數算），加同樣的 edge → 5.5 cm（磨圓後 5.4）；
  # 右手 edge 往上 2 逆解會跳到別的姿勢，所以跟左手一樣 +1。ready 位置不變（沒有 end）
  adjust_cm:
    left: {edge: [-2.0, 0.0, 1.0], end: [0.0, 0.0, 1.0]}
    right: {edge: [-2.0, 0.0, 1.0]}
  # 實機跟隨沒開時目標自己往上補 real_z_comp ×（前 − real_z_from_cm）cm（同 moveit_bridge REAL_Z_COMP、REAL_Z_FROM，要一起改）：
  # 模擬才會停在跟開實機跟隨時一樣的地方（錄 ready 路線、可及範圍、放置）。pose_demo 也用這組算實機的位置。
  # 2026-11-26 從 0.17 × 前 改成 0.14 ×（前 − 14.5）：0.17 補太多（11-19 尺量 4 點、11-26 右手 前 25.4 目標離桌 15 → 尺量 17.9，
  # 照馬達讀數 18.1 → 實際只比目標低 1.4，0.17 補了 4.3）。11-19 的 ready 路線是用 0.17 錄的（補償在關節角裡），ready 會比設定的高約 3 cm
  real_z_comp: 0.14
  real_z_from_cm: 14.5

# base_link（m）→ 量測座標 [前, 右, 高]（cm）。要跟 armpackage arm_config.py 的 MEAS_ORIGIN 一模一樣
# （任務管理換成 cm 送出、moveit_bridge 用同一組換回 base_link），不要單獨改。2026-11-17 確認一致。
frames:
  front_sign: 1.0
  front_offset_cm: 1.35
  right_sign: -1.0
  right_offset_cm: 0.0
  height_sign: 1.0
  height_offset_cm: 120.2

# 桌子（暫時寫死，之後改成偵測）。任務開始時連同其他藥瓶發給 moveit_bridge 的 /arm_ik_obstacles，
# MoveIt 規劃與最後的直線靠近都會避開。桌子做成從地板到桌面的方塊，手臂也不會從桌緣底下掃過去。
#
# 桌面座標（workspace、之後的放置點都用這套，方便拿捲尺量）：[右, 前, 上]（cm）
#   原點 = 桌緣（靠機器人那一邊）上、正對 base_link 左右中線的點，高度 = 桌面；左邊是負的
table:
  edge_from_base_link_cm: 12.0   # base_link（網頁上的三軸）往前到桌緣。2026-11-18 使用者對照網頁的三軸定（原本 16）
  top_cm: 81.2                   # 桌面在量測座標的「高」= 120.2 − 39.0：ZED 量到 base_link 比桌面高 39.0 cm，
                                 # 跟 bottle_localization 算藥瓶位置用的桌面一致（它的 119.5 − 80.5）。不是捲尺量的離地高度
  # bottom_cm: 72.0              # 桌板底面離地（實際桌板 72～80）。2026-11-18 試過畫成桌板：站姿的手在桌板底下，規劃會讓手指
                                 # 從桌板下往前伸，實機手指撞桌子 → 改回從地板到桌面的實心方塊（不設 bottom_cm）
  depth_cm: 75.0                 # 桌緣往前多深（2026-11-17 實量）
  width_cm: 150.0                # 左右多寬（2026-11-17 實量）
  center_right_cm: 0.0           # 桌子左右中線在原點的右邊多少（偏左填負的）；桌子置中 = 0，左右各 75
  margin_cm: [2.0, 3.0, 3.0]     # 場景裡的桌子加厚多少 [前後, 左右, 上下]（一個數字 = 三個方向一樣）：MoveIt 規劃時手臂離真的桌子至少這麼遠。
                                 # 前後 2（2026-11-18）：0 時手會貼著桌緣邊舉邊往前；3 會讓站姿的手（最前到 base_link 前 9.4）就碰到桌子
                                 # （起點碰到的物體 moveit_bridge 會暫時不算）
                                 # （2026-11-17 實機側舉時拇指擦到桌子，模擬路徑只留 2 cm）。從上方抓時手最低處在掌心下
                                 # 4.5 cm，最矮的 b2 掌心離桌 8.8 → 手最低 4.3，所以最多 4 cm，再多就抓不到矮瓶

# 固定在架子、桌子上的其他東西（跟桌子一樣一直放在 MoveIt 場景裡，往外加厚 table.margin_cm）。【待量測】
# 桌面座標（cm）：center = 中心 [右, 前, 上]（手在桌緣後面就是「前」負的；桌面以下「上」負的），size = [左右寬, 前後深, 上下厚]，
# margin_cm 可以每個各自設（沒給 = table.margin_cm），也可以 [前後, 左右, 上下] 分開
# 量測座標的「高」就是離地高度（MEAS_ORIGIN 120.2 = base_link 離地），所以離地 h → 桌面座標「上」= h − table.top_cm
fixtures:
  # 手後面黏在架子上的小桌子（2026-11-18 使用者量）：長 50（左右對稱）、寬 20、離地 101～107；
  # 前緣在 base_link（網頁上的三軸）後 9 cm、後緣 後 29 → 桌面座標 前 −21～−41（桌緣在 base_link 前 12）；
  # 上 101−81.2 = 19.8～25.8。前後不加厚（使用者：從 9 開始畫），左右、上下加厚 1.5。
  # 站姿手臂在這個高度最後到 base_link 後 6.4（URDF），離前緣 2.6（起點就碰到的物體 moveit_bridge 會暫時不算）
  - {id: back_shelf, center: [0.0, -31.0, 22.8], size: [50.0, 20.0, 6.0], margin_cm: [0.0, 1.5, 1.5]}

# 障礙物：除了要抓的那瓶，看到的其他藥瓶都當圓柱障礙物。每一瓶的直徑、高度照它的類別
# （bottle_localization 依 bottle_dims.yaml 填在 /bottle_detections_3d 的 bbox.size），這裡只設多留的餘裕
obstacles:
  margin_cm: 1.0        # 藥瓶半徑、高度各加多少（藥瓶定位誤差約 0.5～1 cm）
  scene_wait_s: 0.3     # 發出場景後等 moveit_bridge 套用，再去問 MoveIt
  scene_confirm_s: 5.0  # 發出場景後問 MoveIt（/get_planning_scene）確認桌子、藥瓶真的在場景裡，沒有就重發，
                        # 超過這麼久還沒有就不動手臂、回 MAN-E-004。moveit_bridge 在 MoveIt 還沒準備好時收到場景會直接放棄、
                        # 不再重試（2026-11-17 開機後第一次移動路徑穿過桌子 13 cm，懷疑就是這個）

# 手臂可及範圍：從上方抓、掌心離桌約 10 cm 時，每個左右位置掌心最遠能到桌緣往前多少（桌面座標，cm）。
# 2026-11-17 reach_test scan 實測（MoveIt 模擬，每 2 cm 試一次，記最後成功的那一格），左右手相同：
#   [離中線往自己那一側, 最遠往前]；中間內插。2026-11-18 桌緣從 base_link 前 16 改成 12，實際位置不變，「前」都 +4。表外（跨到另一側、比最外一列還外）= 這隻手搆不到。
# 藥瓶不在任何一隻手的範圍內 = MAN-E-002；只在一隻手的範圍內就只用那隻（auto 時）。
# 換抓法（掌心方向、高度）要重新跑 reach_test scan 再填。
# 2026-11-19 重測（從 ready 出發、實機跟隨開著，右手；左手抽 18.9、40 兩列，最近、最遠都跟右手一模一樣）：掌心離桌 10（抓取）和 18（預抓）結果一樣，
#   只有中線在 10 時到 28、18 時到 34 → 取小的。csv 在 .11 ~/reach_test_out/20261119_21*_scan_right。沒有 plan_failed。
#   最近（太靠身體 = joint_limit／unreachable）每列不一樣 → reach_near_cm 表，兩列中間取比較遠（保守）的那列，不內插。
workspace:
  reach_front_cm:
    - [0.0, 28.0]
    - [10.0, 34.0]
    - [18.9, 34.0]       # 肩膀正前方
    - [30.0, 34.0]
    - [40.0, 32.0]
    - [50.0, 26.0]
  reach_near_cm:         # [離中線往自己那一側, 最近往前]；沒這張表時用 front_min_cm
    - [0.0, 0.0]
    - [10.0, 4.0]
    - [18.9, 8.0]
    - [30.0, 6.0]
    - [40.0, 0.0]
    - [50.0, 0.0]
  front_min_cm: 6.0      # 舊的（11/17：太靠身體 joint_limit），有 reach_near_cm 就不用

grasp:
  approach: top         # 從上方抓（使用者 2026-11-17 定）。front 要手指橫放、掌心離桌 ≥ 5 cm，手指朝上更要 ≥ 15 cm
  fingers: null         # 手指朝向（度），null = 讓手臂自己挑；0 = 朝前
  palm_gap_cm: 1.0      # 抓取位置：掌心離瓶身表面
  pregrasp_cm: 8.0      # 預抓位置：再往外退多少
  lift_cm: 5.0          # 抓到後往上抬多少；放置時從放置點上方這麼高往下
  # 某隻手的目標高度另外補（cm，所有 /arm_move 都會加；網頁「最後的掌心目標」顯示沒補的）。
  # 2026-11-19 先設左手 +1（在 ready 量到左手低 1），同天用尺量 4 點（右／左 × 前 28／前 12）：左手補 1 之後反而比右手高 1.5～1.7
  # → 不補時左手只比右手高約 0.5，改回 0。ready 錄好的路線另外用 ready_pose.adjust_cm 補（那是在 ready 位置量的，沒改）
  arm_z_offset_cm: {left: 0.0, right: 0.0}
  place_table_margin_cm: 0.5   # 放下那一步桌子上方的加厚（平常是 table.margin_cm 的 3）：實機跟隨開著時 moveit_bridge 也檢查
                               # 實機的位置，瓶底離桌 1 一定在 3 的加厚裡（2026-11-19 實機 collision）。抬起後改回來
  place_gap_cm: 1.0     # 放開時瓶底離放置面多高（實機）。實機跟隨開著時 moveit_bridge 把模擬的目標往上補 0.14 ×（前 − 14.5），
                        # 所以模擬的瓶底會在放置面上方 1 + 補償（tray 前 41.35 → 4.8；2026-11-26 前是 0.17 × 前 → 8.0）；
                        # 實機跟隨沒開（只看模擬）時任務管理自己補一樣多（ready_pose.real_z_comp），模擬才會跟開實機時一樣
  arm_speed: 30         # /arm_speed_cmd，Dynamixel 單位，實機最多 50
  arm_settle_s: 1.0     # 只在 real_arm.required: false 時用：MoveIt 回報到了之後固定等這麼久

real_arm:
  # true：每一步移動前、移動中都要實機跟隨開著（/arm_real_status 的 state = follow），不然回 MAN-E-007；
  #       MoveIt 到了之後等 real_arm_bridge 回報實機停穩（settled）才往下。
  # false：不看實機（也不看馬達 driver），只測 MoveIt（模擬）流程用；MoveIt 到了固定等 grasp.arm_settle_s。
  # launch 給 real_arm:=true / false 時以 launch 為準（不用另一份設定檔）
  required: true

hand:
  # 六軸順序：大拇指彎曲、大拇指橫擺、食指、中指、無名指、小拇指（handpackage hand_config.JOINT_NAMES）。
  # 2026-11-26 使用者實機：從瓶子上方抓瓶蓋，大拇指橫擺要轉進來才抓得到（250 抓不到）：先 100、50，要對準掌心改 20。
  # open_pos = ready 到位後、抓之前張開、放下張開、重試前張開；stand_pos = 回站姿之前（手全張開，同網頁「張開」）
  open_pos: [250, 20, 250, 250, 250, 250]
  stand_pos: [250, 250, 250, 250, 250, 250]
  open_spd: [255, 255, 255, 255, 255, 255]
  open_wait_s: 1.0
  # 夾持（handpackage grip）：每根手指的壓力 = 那根手指 40 格壓感的總和（0~10200，不是公克）減掉開始閉合時的讀數（零點，
  # 2026-11-26 加：右手中指沒碰東西就讀 50 以上）。any = 任一根到門檻整隻手停；each = 到門檻的那根停，其他繼續。
  # 沒碰到的握到 grip_target 為止。有任一根到門檻 = 夾到，全部握到 grip_target 都沒到 = 沒夾到。
  # 2026-11-26 使用者實機：門檻 50、目標 100 抓得到藥罐；目標低於 100 食指會碰到大拇指。原本 250、目標 0（空抓會傷手）
  grip_threshold: 50
  grip_target: [100, 20, 100, 100, 100, 100]   # 大拇指橫擺維持張開時的值（使用者 11-26）
  grip_mode: any      # 2026-11-26 使用者：要對準掌心用 any（原本 each）
  grip_timeout_s: 6.0
  hold_min_mass: 100    # 抬起後五指壓力總和（扣掉夾持的零點）至少這麼多才算還夾著

retries:
  grasp: 1              # 抓取失敗（含驗證沒夾住）再試幾次

timeouts:
  task_s: 30.0          # 主控沒給 timeout_s 時的預設（S3-01：任務 ≤ 30 秒）
  test_s: 120.0         # 網頁測試區一個指令最多做多久
  task_max_s: 300.0
  detect_s: 5.0
  arm_move_s: 20.0
  hand_status_stale_s: 1.0
  joint_states_stale_s: 1.0
  real_status_stale_s: 3.0   # real_arm_bridge 每秒發一次 /arm_real_status
  real_settle_s: 8.0         # MoveIt 到了之後，等實機停穩最多幾秒（實機卡住 2 秒 real_arm_bridge 會自己停掉）

# dry_run：被模擬的那幾段直接模擬成功，其他接實機。
# 只模擬 vision 時，手臂會真的移到下面的假藥瓶位置，要確定那裡是空的、到得了。
# fail 只對有模擬的那段有效（例如 fail: grip 要模擬 hand 才會發生）。
dry_run:
  modules: []               # 要模擬哪幾段：vision / arm / hand 任意組合，[] = 全部接實機。
                            # launch 給 dry_run:=true / false / vision,arm 時以 launch 為準
  # 假藥瓶：桌面座標 [右, 前]（cm，瓶身中心，立在桌面上）、[直徑, 高]（m，同 bottle_dims.yaml）。
  # 要抓的那一類是目標，其他類都當障礙物發給 MoveIt；沒列的類別 = 看不到（MAN-E-003）。
  bottles:
    b1: {table_cm: [18.9, 12.0], size_m: [0.0829, 0.0923]}    # 右肩正前方
    b2: {table_cm: [-18.9, 12.0], size_m: [0.0494, 0.0780]}   # 左肩正前方
    b3: {table_cm: [35.0, 12.0], size_m: [0.0449, 0.0899]}    # b1 右邊 16 cm（抓 b1 時的障礙物）
    b4: {table_cm: [-35.0, 12.0], size_m: [0.0379, 0.0792]}   # b2 左邊 16 cm（抓 b2 時的障礙物）
  step_s: 0.5
  fail: ''                  # 模擬失敗：'' / detect / arm / grip / hold
