# 子三任務管理設定。改完重開節點才生效。

# YOLO 的類別名稱（bottle_localization/config/bottle_dims.yaml 的 key）
bottle_classes: [b1, b2, b3, b4]

# 放置點：掌心要到的位置，實機量測座標 [前, 右, 高]（cm）。【待量測】
place_targets:
  tray_1: {pos_cm: [45.0, 15.0, 100.0], approach: top}

# base_link（m）→ 量測座標（cm）。預設取自 arm_ws README。
frames:
  front_sign: 1.0
  front_offset_cm: 1.35
  right_sign: -1.0
  right_offset_cm: 0.0
  height_sign: 1.0
  height_offset_cm: 120.2

# 手臂工作範圍（量測座標，cm）。藥瓶算出來在範圍外就不抓（MAN-E-002）。【待確認】
workspace:
  min_cm: [10.0, -60.0, 80.0]
  max_cm: [70.0, 60.0, 140.0]

grasp:
  approach: front       # top / front / side
  fingers: null         # 手指朝向（度），null = 讓手臂自己挑；0 = 朝前
  palm_gap_cm: 1.0      # 抓取位置：掌心離瓶身表面
  pregrasp_cm: 8.0      # 預抓位置：再往外退多少
  lift_cm: 5.0          # 抓到後往上抬多少；放置時從放置點上方這麼高往下
  arm_speed: 30         # /arm_speed_cmd，Dynamixel 單位，實機最多 50
  arm_settle_s: 1.0     # MoveIt 回報到了之後再等實機跟上（實機比模擬晚到）

hand:
  open_pos: [250, 250, 250, 250, 250, 250]   # 同網頁預設手勢「張開」
  open_spd: [255, 255, 255, 255, 255, 255]
  open_wait_s: 1.0
  grip_threshold: 250   # 壓力門檻（五指 40 格總和，不是公克）。200~400 輕握
  grip_mode: each
  grip_timeout_s: 6.0
  hold_min_mass: 100    # 抬起後五指壓力總和至少這麼多才算還夾著

detection:
  min_score: 0.5
  stable_frames: 3      # 連續幾幀都看到才採用（取平均）

retries:
  grasp: 1              # 抓取失敗（含驗證沒夾住）再試幾次

timeouts:
  task_s: 30.0          # 主控沒給 timeout_s 時的預設（S3-01：任務 ≤ 30 秒）
  task_max_s: 300.0
  detect_s: 5.0
  arm_move_s: 20.0
  hand_status_stale_s: 1.0
  joint_states_stale_s: 1.0

# dry_run：不接硬體，各轉接層直接模擬成功，用來測流程與主控通訊
dry_run:
  bottle_base_link_m: [0.40, -0.10, -0.15]
  bottle_size_m: [0.05, 0.05, 0.08]
  step_s: 0.5
  fail: 'hold'              # 模擬失敗：'' / detect / arm / grip / hold
