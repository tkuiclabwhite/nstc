# 機器人的基準：輸出座標系（base_link）的名稱，以及量測時用的基準點。
# 換手臂（base_link 改變）時改這個檔，再照 README「準確度校正流程」重量外參。
#
# 基準點 = 量外參（Δx、Δy、Δz）、量高度、實測瓶子位置時，在機器人身上實際量的那一點。
# 2026-11-16 起是新平台（seven_axis_arm_head_urdf）的 base_link 原點（支架中心）。
# 舊平台用的是右肩關節點（armurdf4_with_hand.urdf 的 RshoulderJoint，離地 94.0 cm）。
# 支架中心不方便拉尺的話，可以改用新平台的右肩關節點：reference_point [-0.01375, -0.189, 0.01475]、
# 離地 121.0 cm（= 119.5 + 1.475），桌面換算結果一樣。
#
# 被 launch（節點的 target_frame、桌高換算）和 tools/ 底下的量測工具共用。

# 輸出座標系，也是相機外參的 parent
base_frame: base_link

# 基準點的名稱（量測工具的提示文字用）
reference_name: 支架中心（base_link 原點）

# 基準點在 base_frame 下的位置 [x, y, z]（m），抄自 URDF 的 joint origin
reference_point: [0.0, 0.0, 0.0]

# 基準點離地高度（cm），用捲尺實際量（抓取姿勢、站在平常的位置）
# 2026-11-16 實量 119.5 cm（原先記 118.0）。table_plane 量到的相機高度（左眼離桌 52.4 cm）
# 和 URDF 算的 0.1344 + 0.39 = 52.4 cm 一致，印證 119.5 才對。
reference_height_cm: 119.5
